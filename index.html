<!DOCTYPE html>
<html>
<head>
    <title>AIPickVault Desktop</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: radial-gradient(circle at top, #0f1a2a, #000000 70%);
        color: #e0e0ff;
        font-family: 'Segoe UI', Arial, sans-serif;
        text-shadow: 0 0 4px #00eaff;

        margin: 0;
        padding: 20px;
        box-sizing: border-box;

        height: 100vh;

        display: flex;
        flex-direction: column;
      }

      h1 {
        color: #00eaff;
        text-align: center;
        font-size: 32px;
        margin-bottom: 10px;
        text-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff;
      }

      #modelDisplay {
        text-align: center;
        margin-bottom: 20px;
        color: #00ffaa;
        font-size: 18px;
        text-shadow: 0 0 8px #00ffaa;
      }

      #chat {
        border: 2px solid #00eaff;
        padding: 15px;

        flex: 1;
        min-height: 300px;

        overflow-y: auto;

        background: rgba(0, 20, 40, 0.85);
        box-shadow: 0 0 20px #00eaff;
        border-radius: 10px;

        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
      }

      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 16px;
        color: #e0e0ff;
        box-shadow: 0 0 10px currentColor;
      }

      .avatar.user {
        background: rgba(0, 120, 255, 0.5);
        color: #00aaff;
      }

      .avatar.ai {
        background: rgba(0, 255, 180, 0.5);
        color: #00ffaa;
      }

      .msg {
        padding: 12px 16px;
        border-radius: 12px;

        width: calc(100% - 80px);

        line-height: 1.6;

        box-shadow: 0 0 12px currentColor;

        overflow-wrap: break-word;
        word-break: break-word;
      }

      .user-msg {
        background: rgba(0, 120, 255, 0.35);
        color: #e0e0ff;
        margin-left: auto;
        border-left: 3px solid #00eaff;
      }

      .ai-msg {
        background: rgba(0, 255, 180, 0.25);
        color: #e0e0ff;
        margin-right: auto;
        border-left: 3px solid #00ffaa;
        white-space: pre-wrap;
        line-height: 1.7;
        width: 92%;
        overflow-wrap: break-word;
        word-break: break-word;
      }

      .typing {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
        background: rgba(0, 255, 180, 0.15);
        border-left: 3px solid #00ffaa;
        border-radius: 12px;
        box-shadow: 0 0 12px #00ffaa;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: #00ffaa;
        border-radius: 50%;
        animation: blink 1.4s infinite;
      }

      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes blink {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
      }

      textarea {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #001020;
        color: #e0e0ff;
        border: 2px solid #00eaff;
        border-radius: 8px;
        font-size: 16px;
        box-shadow: 0 0 10px #00eaff;
        outline: none;
      }

      textarea:focus {
        border-color: #00ffaa;
        box-shadow: 0 0 15px #00ffaa;
      }

      .button-row {
          display: flex;
          gap: 10px;
          margin-top: 10px;
      }

      .button-row button {
          flex: 1;
          margin-top: 0;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 12px;
        background: #002040;
        color: #e0e0ff;
        border: 2px solid #00eaff;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 0 10px #00eaff;
      }

      button:hover {
        border-color: #00ffaa;
        box-shadow: 0 0 15px #00ffaa;
      }
    </style>
</head>
<body>

<h1>AIPickVault Desktop</h1>

<select id="modelSelect" style="
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    background: #001020;
    color: #00ffaa;
    border: 2px solid #00ffaa;
    border-radius: 8px;
    font-size: 16px;
    box-shadow: 0 0 10px #00ffaa;
">
    <option value="llama3">llama3</option>
    <option value="qwen3-coder:7b">qwen3-coder:7b</option>
    <option value="qwen3-coder:14b">qwen3-coder:14b</option>
    <option value="qwen3-coder:30b">qwen3-coder:30b</option>
</select>

<div id="modelDisplay">Model: loading...</div>

<div id="chat"></div>

<textarea id="userInput" rows="3" placeholder="Type your message..."></textarea>
<div class="button-row">
  <button id="sendBtn" type="button">Send</button>
  <button id="clearBtn" type="button">Clear</button>
</div>

<script>
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modelDisplay = document.getElementById('modelDisplay');
    const modelSelect = document.getElementById('modelSelect');

    const WELCOME_TEXT =
        "Welcome to AIPickVault Desktop\n\n" +
        "Available Tools:\n\n" +
        "Weather\n" +
        "News\n" +
        "Stocks\n" +
        "Search\n\n" +
        "Try asking:\n\n" +
        "What's the weather?\n" +
        "Breaking AI news\n" +
        "Stock price of NVDA\n" +
        "Search Texas pharmacy technician requirements";

    function appendMessage(role, text) {
        const row = document.createElement('div');
        row.className = 'msg-row';

        const avatar = document.createElement('div');
        avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'ai');
        avatar.textContent = role === 'user' ? 'U' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'msg ' + (role === 'user' ? 'user-msg' : 'ai-msg');
        bubble.textContent = text;

        if (role === 'user') {
            row.appendChild(bubble);
            row.appendChild(avatar);
        } else {
            row.appendChild(avatar);
            row.appendChild(bubble);
        }

        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
        return row;
    }

    function showWelcome() {
        chat.replaceChildren();
        appendMessage('ai', WELCOME_TEXT);
    }

    function createTypingIndicator() {
        const row = document.createElement('div');
        row.className = 'msg-row';

        const avatar = document.createElement('div');
        avatar.className = 'avatar ai';
        avatar.textContent = 'AI';

        const typing = document.createElement('div');
        typing.className = 'typing';
        for (let i = 0; i < 3; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            typing.appendChild(dot);
        }

        row.appendChild(avatar);
        row.appendChild(typing);
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
        return row;
    }

    showWelcome();

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        const selectedModel = modelSelect.value;

        appendMessage('user', message);
        userInput.value = '';

        const typingRow = createTypingIndicator();

        try {
            const response = await window.api.askModel({
                message,
                model: selectedModel
            });

            modelDisplay.textContent = 'Model: ' + (response.model || selectedModel);
            typingRow.remove();
            appendMessage('ai', response.text || 'No response received.');
        } catch (err) {
            typingRow.remove();
            appendMessage(
                'ai',
                'Something went wrong talking to the assistant. Please try again.'
            );
            console.error(err);
        }
    }

    modelDisplay.textContent = 'Model: ' + modelSelect.value;

    modelSelect.addEventListener('change', () => {
        modelDisplay.textContent = 'Model: ' + modelSelect.value;
    });

    sendBtn.addEventListener('click', sendMessage);

    if (clearBtn) {
        clearBtn.addEventListener('click', () => {
            chat.replaceChildren();
            appendMessage('ai', 'Chat cleared.');
        });
    }

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
