<!DOCTYPE html>
<html>
<head>
    <title>AIPickVault Desktop</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: radial-gradient(circle at top, #0f1a2a, #000000 70%);
        color: #e0e0ff;
        font-family: 'Segoe UI', Arial, sans-serif;
        text-shadow: 0 0 4px #00eaff;

        margin: 0;
        padding: 20px;
        box-sizing: border-box;

        height: 100vh;

        display: flex;
        flex-direction: column;
      }

      h1 {
        color: #00eaff;
        text-align: center;
        font-size: 32px;
        margin-bottom: 10px;
        text-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff;
      }

      #modelDisplay {
        text-align: center;
        margin-bottom: 20px;
        color: #00ffaa;
        font-size: 18px;
        text-shadow: 0 0 8px #00ffaa;
      }

      #chat {
        border: 2px solid #00eaff;
        padding: 15px;

        flex: 1;
        min-height: 300px;

        overflow-y: auto;

        background: rgba(0, 20, 40, 0.85);
        box-shadow: 0 0 20px #00eaff;
        border-radius: 10px;

        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
      }

      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 16px;
        color: #e0e0ff;
        box-shadow: 0 0 10px currentColor;
      }

      .avatar.user {
        background: rgba(0, 120, 255, 0.5);
        color: #00aaff;
      }

      .avatar.ai {
        background: rgba(0, 255, 180, 0.5);
        color: #00ffaa;
      }

      .msg {
        padding: 12px 16px;
        border-radius: 12px;

        width: calc(100% - 80px);

        line-height: 1.6;

        box-shadow: 0 0 12px currentColor;

        overflow-wrap: break-word;
        word-break: break-word;
      }

      .user-msg {
        background: rgba(0, 120, 255, 0.35);
        color: #e0e0ff;
        margin-left: auto;
        border-left: 3px solid #00eaff;
      }

      .ai-msg {
        background: rgba(0, 255, 180, 0.25);
        color: #e0e0ff;
        margin-right: auto;
        border-left: 3px solid #00ffaa;
        white-space: pre-wrap;
        line-height: 1.7;
        width: 92%;
        overflow-wrap: break-word;
        word-break: break-word;
      }

      .ai-msg .stream-note {
        display: block;
        opacity: 0.75;
        font-size: 0.92em;
        margin-bottom: 8px;
        color: #88ffcc;
      }

      #memoryHint {
        text-align: center;
        margin-top: -12px;
        margin-bottom: 12px;
        color: #668899;
        font-size: 13px;
        text-shadow: none;
        min-height: 1.2em;
      }

      .ai-msg .stream-body {
        display: block;
      }

      .ai-msg.thinking .stream-body::before {
        content: "thinking…";
        opacity: 0.55;
        font-style: italic;
        letter-spacing: 0.02em;
        animation: thinkPulse 1.4s ease-in-out infinite;
      }

      @keyframes thinkPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }

      .typing {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
        background: rgba(0, 255, 180, 0.15);
        border-left: 3px solid #00ffaa;
        border-radius: 12px;
        box-shadow: 0 0 12px #00ffaa;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: #00ffaa;
        border-radius: 50%;
        animation: blink 1.4s infinite;
      }

      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes blink {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
      }

      textarea {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #001020;
        color: #e0e0ff;
        border: 2px solid #00eaff;
        border-radius: 8px;
        font-size: 16px;
        box-shadow: 0 0 10px #00eaff;
        outline: none;
      }

      textarea:focus {
        border-color: #00ffaa;
        box-shadow: 0 0 15px #00ffaa;
      }

      .button-row {
          display: flex;
          gap: 10px;
          margin-top: 10px;
      }

      .button-row button {
          flex: 1;
          margin-top: 0;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 12px;
        background: #002040;
        color: #e0e0ff;
        border: 2px solid #00eaff;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 0 10px #00eaff;
      }

      button:hover {
        border-color: #00ffaa;
        box-shadow: 0 0 15px #00ffaa;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        box-shadow: none;
      }
    </style>
</head>
<body>

<h1>AIPickVault Desktop</h1>

<select id="modelSelect" style="
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    background: #001020;
    color: #00ffaa;
    border: 2px solid #00ffaa;
    border-radius: 8px;
    font-size: 16px;
    box-shadow: 0 0 10px #00ffaa;
">
    <option value="qwen3:30b" selected>qwen3:30b</option>
    <option value="qwen3:14b">qwen3:14b</option>
    <option value="qwen3:8b">qwen3:8b</option>
    <option value="qwen3-coder:30b">qwen3-coder:30b</option>
    <option value="llama3">llama3</option>
    <option value="local-assistant">local-assistant</option>
    <option value="local-assistant-plus">local-assistant-plus</option>
    <option value="local-assistant-max">local-assistant-max</option>
</select>

<div id="modelDisplay">Model: loading...</div>
<div id="memoryHint"></div>

<div id="chat"></div>

<textarea id="userInput" rows="3" placeholder="Type your message..."></textarea>
<div class="button-row">
  <button id="sendBtn" type="button">Send</button>
  <button id="clearBtn" type="button">Clear</button>
</div>

<script>
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modelDisplay = document.getElementById('modelDisplay');
    const modelSelect = document.getElementById('modelSelect');
    const memoryHint = document.getElementById('memoryHint');

    let isStreaming = false;
    let memoryTurns = 0;

    function updateMemoryHint(turns) {
        memoryTurns = typeof turns === 'number' ? turns : memoryTurns;
        if (!memoryHint) return;
        if (memoryTurns > 0) {
            memoryHint.textContent = 'Remembering ' + memoryTurns + ' turn' + (memoryTurns === 1 ? '' : 's');
        } else {
            memoryHint.textContent = '';
        }
    }

    const WELCOME_TEXT =
        "Welcome to AIPickVault Desktop\n\n" +
        "Available Tools:\n\n" +
        "Weather\n" +
        "News\n" +
        "Stocks\n" +
        "Search\n\n" +
        "Try asking:\n\n" +
        "What's the weather?\n" +
        "Breaking AI news\n" +
        "Stock price of NVDA\n" +
        "Search Texas pharmacy technician requirements";

    function appendMessage(role, text) {
        const row = document.createElement('div');
        row.className = 'msg-row';

        const avatar = document.createElement('div');
        avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'ai');
        avatar.textContent = role === 'user' ? 'U' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'msg ' + (role === 'user' ? 'user-msg' : 'ai-msg');
        bubble.textContent = text;

        if (role === 'user') {
            row.appendChild(bubble);
            row.appendChild(avatar);
        } else {
            row.appendChild(avatar);
            row.appendChild(bubble);
        }

        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
        return row;
    }

    function createStreamingBubble() {
        const row = document.createElement('div');
        row.className = 'msg-row';

        const avatar = document.createElement('div');
        avatar.className = 'avatar ai';
        avatar.textContent = 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'msg ai-msg thinking';

        const noteEl = document.createElement('span');
        noteEl.className = 'stream-note';
        noteEl.hidden = true;

        const bodyEl = document.createElement('span');
        bodyEl.className = 'stream-body';

        bubble.appendChild(noteEl);
        bubble.appendChild(bodyEl);

        row.appendChild(avatar);
        row.appendChild(bubble);
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;

        return {
            row,
            bubble,
            noteEl,
            bodyEl,
            text: '',
            hasToken: false,
            setNote(note) {
                if (!note) return;
                noteEl.hidden = false;
                noteEl.textContent = note;
                chat.scrollTop = chat.scrollHeight;
            },
            appendChunk(chunk) {
                if (!chunk) return;
                if (!this.hasToken) {
                    this.hasToken = true;
                    bubble.classList.remove('thinking');
                    this.text = '';
                }
                this.text += chunk;
                bodyEl.textContent = this.text;
                chat.scrollTop = chat.scrollHeight;
            },
            setFinal(text) {
                bubble.classList.remove('thinking');
                this.text = text == null ? '' : String(text);
                bodyEl.textContent = this.text;
                chat.scrollTop = chat.scrollHeight;
            },
            setError(text) {
                bubble.classList.remove('thinking');
                noteEl.hidden = true;
                this.text = text == null ? '' : String(text);
                bodyEl.textContent = this.text;
                chat.scrollTop = chat.scrollHeight;
            }
        };
    }

    function showWelcome() {
        chat.replaceChildren();
        appendMessage('ai', WELCOME_TEXT);
    }

    function setStreaming(active) {
        isStreaming = !!active;
        sendBtn.disabled = isStreaming;
        userInput.disabled = isStreaming;
    }

    showWelcome();

    async function sendMessage() {
        if (isStreaming) return;

        const message = userInput.value.trim();
        if (!message) return;

        const selectedModel = modelSelect.value;

        appendMessage('user', message);
        userInput.value = '';

        const streamUi = createStreamingBubble();
        setStreaming(true);

        let finished = false;
        const unsubs = [];

        const finish = () => {
            if (finished) return;
            finished = true;
            unsubs.forEach((fn) => {
                try { fn(); } catch (_) {}
            });
            setStreaming(false);
        };

        if (window.api && typeof window.api.onAskModelNote === 'function') {
            unsubs.push(window.api.onAskModelNote((payload) => {
                if (finished) return;
                streamUi.setNote(payload && payload.text);
            }));
        }
        if (window.api && typeof window.api.onAskModelChunk === 'function') {
            unsubs.push(window.api.onAskModelChunk((payload) => {
                if (finished) return;
                streamUi.appendChunk(payload && payload.chunk);
            }));
        }
        if (window.api && typeof window.api.onAskModelDone === 'function') {
            unsubs.push(window.api.onAskModelDone((payload) => {
                if (finished) return;
                if (payload && payload.model) {
                    modelDisplay.textContent = 'Model: ' + payload.model;
                }
                if (payload && typeof payload.memoryTurns === 'number') {
                    updateMemoryHint(payload.memoryTurns);
                }
                if (!streamUi.hasToken && payload && payload.text) {
                    streamUi.setFinal(payload.text);
                }
                finish();
            }));
        }
        if (window.api && typeof window.api.onAskModelError === 'function') {
            unsubs.push(window.api.onAskModelError((payload) => {
                if (finished) return;
                streamUi.setError(
                    (payload && payload.text) ||
                    'Something went wrong talking to the assistant. Please try again.'
                );
                modelDisplay.textContent = 'Model: Error';
                finish();
            }));
        }

        try {
            const response = await window.api.askModel({
                message,
                model: selectedModel
            });

            if (response && response.model) {
                modelDisplay.textContent = 'Model: ' + response.model;
            }
            if (response && typeof response.memoryTurns === 'number') {
                updateMemoryHint(response.memoryTurns);
            }

            // If events already finished the UI, just clean up.
            // Otherwise fill from invoke result (non-stream / static replies).
            if (!finished) {
                if (!streamUi.hasToken) {
                    streamUi.setFinal(
                        (response && response.text) || 'No response received.'
                    );
                }
                finish();
            }
        } catch (err) {
            if (!finished) {
                streamUi.setError(
                    'Something went wrong talking to the assistant. Please try again.'
                );
                finish();
            }
            console.error(err);
        }
    }

    modelDisplay.textContent = 'Model: ' + modelSelect.value;

    modelSelect.addEventListener('change', () => {
        modelDisplay.textContent = 'Model: ' + modelSelect.value;
    });

    sendBtn.addEventListener('click', sendMessage);

    if (clearBtn) {
        clearBtn.addEventListener('click', async () => {
            if (isStreaming) return;
            try {
                if (window.api && typeof window.api.clearConversation === 'function') {
                    await window.api.clearConversation();
                }
            } catch (err) {
                console.error(err);
            }
            updateMemoryHint(0);
            chat.replaceChildren();
            appendMessage('ai', 'Chat cleared.');
        });
    }

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
